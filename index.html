<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>英單防線：神話塔防</title>
    <style>
        :root {
            --ui-blue: #00d2ff;
            --ui-dark: rgba(10, 15, 30, 0.85);
            --ui-panel: rgba(20, 30, 60, 0.9);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { 
            background: #050510; 
            color: white; 
            overflow: hidden; 
            display: flex; 
            justify-content: center;
            height: 100dvh;
            width: 100vw;
        }
        /* 電腦寬螢幕兩側邊框裝飾與限制寬度 */
        #app {
            width: 100%;
            max-width: 540px;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            background: #020205;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.1);
            border-left: 1px solid rgba(0,210,255,0.2);
            border-right: 1px solid rgba(0,210,255,0.2);
            z-index: 1;
        }
        @media (min-width: 541px) {
            body::before, body::after {
                content: ''; position: absolute; top: 0; width: calc(50vw - 270px); height: 100%;
                background: repeating-linear-gradient(45deg, #050510 0%, #050510 10px, #0a0a1a 10px, #0a0a1a 20px);
                opacity: 0.5; z-index: 0; pointer-events: none;
            }
            body::before { left: 0; border-right: 2px solid var(--ui-blue); }
            body::after { right: 0; border-left: 2px solid var(--ui-blue); }
        }

        /* Canvas 圖層 */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #bg-canvas { z-index: -2; }
        #game-canvas { z-index: 5; }
        #fx-canvas { z-index: 6; }
        
        /* 介面共用 */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; z-index: 10;
            padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
            transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none; display: none !important; }
        
        /* 頂部狀態列 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 20; height: 60px; flex-shrink: 0;
        }
        .stats { display: flex; gap: 10px; align-items: center; text-shadow: 0 2px 4px black; }
        .badge { background: rgba(0,210,255,0.2); border: 1px solid var(--ui-blue); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: var(--ui-blue); }
        .currency { color: #ffd700; font-weight: bold; display: flex; align-items: center; gap: 4px;}
        .top-btns button { background: var(--ui-panel); border: 1px solid #555; color: white; padding: 5px 10px; border-radius: 4px; margin-left: 5px; font-size: 12px; cursor: pointer; }
        
        /* 大廳 */
        #menu-screen { justify-content: space-between; }
        .hangar-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .hangar-title { font-size: 20px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--ui-blue); margin-bottom: -20px; z-index: 1; }
        #hangar-canvas { width: 220px; height: 170px; pointer-events: auto; cursor: pointer; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); }
        .tower-info-tag { background: var(--ui-dark); border: 1px solid #00ff88; padding: 5px 15px; border-radius: 20px; font-size: 12px; color: #00ff88; margin-top: -10px; z-index: 1; }
        
        .campaign-board { display: flex; flex-direction: column; gap: 15px; padding: 20px; margin-bottom: 20px; }
        .route-btn {
            background: linear-gradient(135deg, rgba(20,40,80,0.9), rgba(10,20,40,0.9));
            border: 2px solid var(--ui-blue); border-radius: 12px; padding: 20px;
            color: white; font-size: 18px; font-weight: bold; text-align: left;
            position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .route-btn::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent); transform: rotate(45deg); animation: shine 3s infinite; pointer-events: none; }
        @keyframes shine { 0% { left: -100%; } 100% { left: 100%; } }
        .route-progress { font-size: 12px; color: #aaa; margin-top: 5px; font-weight: normal; }
        
        .bottom-nav { display: flex; justify-content: space-between; padding: 15px; }
        .nav-btn { background: var(--ui-dark); border: 1px solid #444; border-radius: 8px; padding: 10px 15px; color: #ddd; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        
        /* 戰鬥介面 */
        #combat-screen { justify-content: space-between; }
        .battle-hud { display: flex; justify-content: space-between; padding: 10px 20px; z-index: 20; }
        .hp-bar-bg { width: 150px; height: 12px; background: rgba(0,0,0,0.8); border: 1px solid #555; border-radius: 6px; overflow: hidden; margin-top: 5px; }
        .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00ff88, #00bfff); transition: width 0.2s; }
        
        .quiz-panel {
            background: linear-gradient(to top, rgba(10,15,30,1) 60%, rgba(10,15,30,0.8));
            border-top: 2px solid var(--ui-blue); padding: 15px; padding-bottom: calc(15px + var(--safe-bottom));
            display: flex; flex-direction: column; gap: 10px; z-index: 20;
        }
        .question-text { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 10px; min-height: 54px; display: flex; align-items: center; justify-content: center; line-height: 1.3;}
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn { background: var(--ui-panel); border: 1px solid #447; border-radius: 8px; padding: 15px 10px; color: white; font-size: 16px; min-height: 55px; transition: 0.1s; }
        .option-btn:active { transform: scale(0.95); background: #225; }
        .option-btn.correct { background: #008800; border-color: #00ff00; }
        .option-btn.wrong { background: #880000; border-color: #ff0000; }
        .option-btn.ink-blurred { filter: blur(4px) brightness(0.5); pointer-events: none; }
        
        .timer-bar { height: 4px; background: #333; border-radius: 2px; overflow: hidden; margin-bottom: 5px; }
        .timer-fill { height: 100%; background: #00d2ff; width: 100%; transform-origin: left; }
        
        /* 彈窗共通 (全螢幕捲動) */
        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; flex-direction: column;
            padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom)) 20px;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .modal-title { font-size: 22px; color: var(--ui-blue); font-weight: bold; }
        .close-btn { background: #c0392b; color: white; border: none; padding: 5px 15px; border-radius: 4px; font-weight: bold; }
        
        /* 選關網格 */
        .stage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding-bottom: 50px; }
        .stage-node {
            aspect-ratio: 1; background: var(--ui-dark); border: 1px solid #444; border-radius: 8px;
            display: flex; justify-content: center; align-items: center; font-weight: bold;
            color: #666; flex-shrink: 0;
        }
        .stage-node.unlocked { color: white; border-color: var(--ui-blue); background: rgba(0,210,255,0.1); box-shadow: 0 0 10px rgba(0,210,255,0.2) inset;}
        .stage-node.cleared { color: #ffd700; border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .stage-node.boss { border-style: dashed; border-width: 2px; }

        /* 圖鑑與商店卡片 */
        .card-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 30px; }
        .card-item {
            background: var(--ui-panel); border: 1px solid #555; border-radius: 8px; padding: 10px;
            display: flex; gap: 15px; align-items: center; flex-shrink: 0; min-height: 95px;
        }
        .card-icon-box { width: 70px; height: 70px; background: rgba(0,0,0,0.5); border-radius: 6px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; position: relative;}
        .card-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .card-name { font-weight: bold; font-size: 16px; margin-bottom: 4px; display: flex; justify-content: space-between;}
        .card-desc { font-size: 12px; color: #aaa; line-height: 1.4; }
        
        /* 轉蛋動畫層 */
        #gacha-fx-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #gacha-skip { position: absolute; top: calc(20px + var(--safe-top)); right: 20px; z-index: 201; background: rgba(255,255,255,0.2); border:1px solid white; color:white; padding:5px 15px; border-radius:15px;}
        .gacha-result-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 90%; max-width: 480px; z-index: 201;}
        .gacha-card { 
            aspect-ratio: 3/4; background: #111; border: 2px solid #333; border-radius: 8px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; transform: translateY(20px) scale(0.8); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .gacha-card.reveal { opacity: 1; transform: translateY(0) scale(1); }
        .r-N { border-color: #aaa; box-shadow: 0 0 10px #aaa inset;}
        .r-R { border-color: #b055ff; box-shadow: 0 0 15px #b055ff inset;}
        .r-SR { border-color: #ffd700; box-shadow: 0 0 20px #ffd700 inset;}
        .r-UR { border-image: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3) 1; box-shadow: 0 0 25px rgba(255,255,255,0.8) inset;}
        
        /* 勝利結算 */
        #victory-banner {
            position: absolute; top: 30%; left: 0; width: 100%; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.8), transparent);
            padding: 20px 0; text-align: center; transform: scaleY(0); transition: transform 0.3s; z-index: 150;
        }
        #victory-banner.show { transform: scaleY(1); }
        .vic-title { font-size: 36px; font-weight: 900; color: white; text-shadow: 0 0 15px #ffd700, 2px 2px 0 #000; letter-spacing: 5px; }
        .vic-rewards { margin-top: 15px; font-size: 20px; color: #00ff88; font-weight: bold; text-shadow: 1px 1px 0 #000;}
        .vic-btns { margin-top: 30px; display: flex; justify-content: center; gap: 20px; }
        .vic-btns button { padding: 12px 25px; border-radius: 25px; font-size: 16px; font-weight: bold; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn-lobby { background: #555; color: white; }
        .btn-next { background: #ffd700; color: black; }

        /* FPS & 提示 */
        #fps-counter { position: absolute; top: calc(65px + var(--safe-top)); right: 10px; color: #0f0; font-size: 10px; font-family: monospace; z-index: 99; opacity: 0.7;}
        .floating-text { position: absolute; pointer-events: none; font-weight: bold; text-shadow: 1px 1px 2px black; z-index: 80; animation: floatUp 1s forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-40px) scale(1.2); opacity: 0; } }
        
        .overheat-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,0,0,0.2); z-index:15; pointer-events:none; display:none; }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="bg-canvas"></canvas>
        <canvas id="game-canvas"></canvas>
        <canvas id="fx-canvas"></canvas>
        <div id="fps-counter">FPS: 60</div>
        
        <!-- 頂部通用狀態列 -->
        <div class="top-bar">
            <div class="stats">
                <div class="badge" id="player-rank">列兵</div>
                <div class="currency">💎 <span id="diamond-count">500</span></div>
            </div>
            <div class="top-btns">
                <button onclick="addDiamonds(5000)">+5000</button>
                <button onclick="toggleAudio()">🔊</button>
                <button onclick="showModal('sys-modal')">⚙️</button>
            </div>
        </div>

        <!-- 大廳介面 -->
        <div id="menu-screen" class="screen">
            <div class="hangar-area">
                <div class="hangar-title">戰術機庫</div>
                <canvas id="hangar-canvas" onclick="showModal('tower-modal')"></canvas>
                <div class="tower-info-tag" id="hangar-tower-name">UR 毀滅星神 +1</div>
            </div>
            <div class="campaign-board">
                <div class="route-btn" onclick="openStageSelect('vocab')">
                    ⚔️ 單字征途
                    <div class="route-progress" id="vocab-progress">進度：第 1 / 100 關</div>
                </div>
                <div class="route-btn" style="border-color:#b055ff;" onclick="openStageSelect('grammar')">
                    ⚡ 文法試煉
                    <div class="route-progress" id="grammar-progress">進度：第 1 / 100 關</div>
                </div>
            </div>
            <div class="bottom-nav">
                <div class="nav-btn" onclick="showModal('gacha-modal')">🎰 <span>轉蛋機</span></div>
                <div class="nav-btn" onclick="showModal('monster-modal')">👾 <span id="monster-col-txt">圖鑑 0/42</span></div>
                <div class="nav-btn" onclick="showModal('wrong-book-modal')">📖 <span>錯題本</span></div>
            </div>
        </div>

        <!-- 戰鬥介面 -->
        <div id="combat-screen" class="screen hidden">
            <div class="battle-hud">
                <div>
                    <div style="font-size: 12px; color: #aaa;">防線耐久</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="base-hp-fill"></div></div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 12px; color: #aaa;" id="combat-stage-txt">單字 第 1 關</div>
                    <div style="font-weight: bold; color: var(--ui-blue);" id="wave-txt">WAVE 1/5</div>
                </div>
            </div>
            <div class="overheat-overlay" id="overheat-fx"></div>
            <div style="flex:1"></div> <!-- 填空 -->
            
            <div class="quiz-panel">
                <div class="timer-bar"><div class="timer-fill" id="quiz-timer"></div></div>
                <div class="question-text" id="q-text">載入中...</div>
                <div class="options-grid">
                    <button class="option-btn" id="opt-0" onclick="answer(0)"></button>
                    <button class="option-btn" id="opt-1" onclick="answer(1)"></button>
                    <button class="option-btn" id="opt-2" onclick="answer(2)"></button>
                    <button class="option-btn" id="opt-3" onclick="answer(3)"></button>
                </div>
            </div>
        </div>

        <!-- 勝利結算 -->
        <div id="victory-banner">
            <div class="vic-title" id="vic-title-txt">VICTORY！</div>
            <div class="vic-rewards" id="vic-reward-txt">+150 💎</div>
            <div style="font-size:14px; margin-top:5px; color:#fff;" id="vic-stats">答對率 100% | 神速 x 3</div>
            <div class="vic-btns">
                <button class="btn-lobby" onclick="returnToMenu()">返回大廳</button>
                <button class="btn-next" onclick="nextStage()">下一關 ➔</button>
            </div>
        </div>

        <!-- 選關彈窗 -->
        <div id="stage-modal" class="modal hidden">
            <div class="modal-header">
                <div class="modal-title" id="stage-modal-title">單字征途</div>
                <button class="close-btn" onclick="hideModal('stage-modal')">X</button>
            </div>
            <div class="stage-grid" id="stage-grid-container"></div>
        </div>

        <!-- 裝備圖鑑彈窗 -->
        <div id="tower-modal" class="modal hidden">
            <div class="modal-header">
                <div class="modal-title">砲塔裝備庫</div>
                <button class="close-btn" onclick="hideModal('tower-modal')">X</button>
            </div>
            <div class="card-list" id="tower-list-container"></div>
        </div>

        <!-- 怪物圖鑑彈窗 -->
        <div id="monster-modal" class="modal hidden">
            <div class="modal-header">
                <div class="modal-title">神話與傳說異聞錄</div>
                <button class="close-btn" onclick="hideModal('monster-modal')">X</button>
            </div>
            <div class="card-list" id="monster-list-container"></div>
        </div>

        <!-- 轉蛋彈窗 -->
        <div id="gacha-modal" class="modal hidden">
            <div class="modal-header">
                <div class="modal-title">星際召喚陣</div>
                <button class="close-btn" onclick="hideModal('gacha-modal')">X</button>
            </div>
            <div style="text-align: center; margin-bottom: 20px;">
                <p style="color:#aaa; font-size:14px; margin-bottom:10px;">消耗鑽石召喚強大機甲。重複獲得轉為強化等級。</p>
                <p>N: 50% | R: 35% | SR: 12% | UR: 3%</p>
            </div>
            <div style="display:flex; justify-content:center; gap:20px; margin-top:auto; margin-bottom: 50px;">
                <button class="route-btn" style="padding:15px; font-size:16px; width: 140px; text-align:center;" onclick="performGacha(1)">單抽<br><span style="color:#ffd700">100 💎</span></button>
                <button class="route-btn" style="padding:15px; font-size:16px; width: 140px; text-align:center; border-color:#ffd700;" onclick="performGacha(10)">10 連抽<br><span style="color:#ffd700">900 💎</span><br><span style="font-size:10px;color:#aaa">保底 SR</span></button>
            </div>
        </div>
        
        <!-- 系統管理 -->
        <div id="sys-modal" class="modal hidden">
            <div class="modal-header">
                <div class="modal-title">指揮官終端</div>
                <button class="close-btn" onclick="hideModal('sys-modal')">X</button>
            </div>
            <div class="card-list">
                <button class="nav-btn" style="background:#800" onclick="resetSave()">⚠️ 刪除進度 (重置為第 1 關)</button>
            </div>
        </div>

        <!-- 轉蛋動畫遮罩 -->
        <div id="gacha-fx-layer" class="hidden">
            <button id="gacha-skip" onclick="skipGacha()">跳過動畫 ➔</button>
            <canvas id="gacha-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index: 200; pointer-events:none;"></canvas>
            <div class="gacha-result-grid" id="gacha-result"></div>
            <button id="gacha-ok-btn" class="hidden" style="z-index:202; margin-top:20px; padding:10px 30px; background:var(--ui-blue); color:black; font-weight:bold; border-radius:20px; border:none;" onclick="closeGachaFx()">確認</button>
        </div>

    </div>

<script>
/**
 * 高品質 160 題庫 (無重複機制專用)
 * 格式：路線|難度(1-4)|題幹|A|B|C|D|答案索引(0-3)|解析
 */
const Q_RAW = `
vocab|1|It is difficult to ______ the language barrier.|overcome|overlook|overtake|overdo|0|overcome 克服
vocab|1|She is very ______ and studies 5 hours a day.|diligent|lazy|casual|random|0|diligent 勤勉的
vocab|1|He tried to ______ his friend to join the club.|persuade|invade|evade|parade|0|persuade 說服
vocab|1|The police were ______ of the man in the dark coat.|suspicious|delicious|precious|conscious|0|suspicious 懷疑的
vocab|1|We need to ______ the old building to build a park.|demolish|construct|protect|decorate|0|demolish 拆毀
vocab|1|The factory causes serious ______ to the river.|pollution|population|protection|production|0|pollution 汙染
vocab|1|She made a great ______ to the science project.|contribution|distribution|attribution|retribution|0|contribution 貢獻
vocab|1|The news caused a lot of ______ among the public.|confusion|conclusion|exclusion|inclusion|0|confusion 困惑
vocab|1|He is highly ______ of his team's success.|confident|diffident|evident|incident|0|confident 有信心的
vocab|1|We must ______ our natural resources for future generations.|conserve|consume|waste|destroy|0|conserve 保存
vocab|1|The manager will ______ the meeting tomorrow.|attend|intend|pretend|extend|0|attend 參加
vocab|1|The company offers a wide ______ of products.|variety|society|anxiety|piety|0|variety 多樣化
vocab|1|She was ______ by his sudden appearance.|surprised|supposed|supported|surrounded|0|surprised 驚訝的
vocab|1|The new policy will ______ everyone in the company.|affect|effect|infect|defect|0|affect 影響(動詞)
vocab|1|The book provides a ______ account of the war.|detailed|failed|sailed|nailed|0|detailed 詳細的
vocab|1|She is a very ______ person who always gives to charity.|generous|nervous|jealous|serious|0|generous 慷慨的
vocab|1|The athlete showed great ______ during the marathon.|endurance|insurance|assurance|clearance|0|endurance 耐力
vocab|1|We must ______ the problem immediately.|resolve|dissolve|involve|evolve|0|resolve 解決
vocab|1|The movie was so ______ that I cried.|moving|boring|exciting|frightening|0|moving 令人感動的
vocab|1|He gave a ______ reply to my question.|prompt|pump|plump|plum|0|prompt 迅速的
vocab|2|The government plans to ______ taxes next year.|reduce|produce|introduce|induce|0|reduce 減少

// --- 音效系統 (Web Audio API) ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if(!audioCtx) audioCtx = new AudioCtx(); }
function toggleAudio() { Save.sound = !Save.sound; saveGame(); }
function playSynth(type) {
    if(!Save.sound) return;
    initAudio();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    let now = audioCtx.currentTime;
    
    if(type === 'shoot') {
        osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if(type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if(type === 'correct') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now+0.1); // E5
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if(type === 'wrong') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.4);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    } else if(type === 'gacha_sr') {
        // Arpeggio
        [440, 554, 659, 880].forEach((freq, i) => {
            let o = audioCtx.createOscillator(); let g = audioCtx.createGain();
            o.type = 'sine'; o.frequency.value = freq;
            g.gain.setValueAtTime(0.2, now + i*0.1); g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.5);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(now + i*0.1); o.stop(now + i*0.1 + 0.5);
        });
    } else if(type === 'victory') {
        osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now+0.2); osc.frequency.setValueAtTime(659, now+0.4);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 1.0);
        osc.start(now); osc.stop(now + 1.0);
    }
}

// --- 繪圖引擎共用 ---
function drawGlow(ctx, x, y, r, color, alpha=0.5) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
    ctx.fill();
}
// 塔繪製 (2.5D)
function drawTower(ctx, towerObj, x, y, angle, scale=1) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    // 底座
    ctx.fillStyle = '#223';
    ctx.beginPath(); ctx.moveTo(-30, 20); ctx.lineTo(30, 20); ctx.lineTo(20, -10); ctx.lineTo(-20, -10); ctx.fill();
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1; ctx.stroke();
    
    // 稀有度光環
    let auraColors = { 'N': 'rgba(0,100,255,', 'R': 'rgba(150,0,255,', 'SR': 'rgba(255,200,0,', 'UR': 'rgba(255,0,255,' };
    let c = auraColors[towerObj.rarity] || auraColors['N'];
    drawGlow(ctx, 0, 10, 40, c+'1)', 0.2);

    ctx.rotate(angle);
    // 砲管
    ctx.fillStyle = '#555';
    let recoil = towerObj.cooldown > 0 ? -5 : 0; // 模擬後座力
    if(towerObj.rarity === 'N' || towerObj.rarity === 'R') {
        ctx.fillRect(0, -5, 35 + recoil, 10);
    } else {
        ctx.fillRect(0, -10, 40 + recoil, 8);
        ctx.fillRect(0, 2, 40 + recoil, 8);
    }
    // 機體中心
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2);
    ctx.fillStyle = '#334'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.stroke();
    
    // 砲口焰
    if(towerObj.cooldown > (1/towerObj.fireRate - 0.1)) {
        ctx.fillStyle = '#fa0';
        ctx.beginPath(); ctx.moveTo(40, -5); ctx.lineTo(55, 0); ctx.lineTo(40, 5); ctx.fill();
    }
    ctx.restore();
}
