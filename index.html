<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>英單防線：神話塔防</title>
<style>
  :root {
    --ui-blue: #00d2ff; --ui-purple: #bc13fe; --ui-gold: #ffd700;
    --ui-dark: rgba(10, 15, 30, 0.95); --ui-panel: rgba(20, 30, 60, 0.9);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
  body { background: #050510; color: white; overflow: hidden; display: flex; justify-content: center; height: 100dvh; width: 100vw; }
  
  /* ================= 1. 全裝置自適應滿版容器 ================= */
  #app {
    width: 100%; max-width: 540px; height: 100%; position: relative;
    display: flex; flex-direction: column; background: #020205;
    box-shadow: 0 0 30px rgba(0, 210, 255, 0.15); z-index: 1;
    border-left: 1px solid rgba(0,210,255,0.2); border-right: 1px solid rgba(0,210,255,0.2);
  }
  @media (min-width: 541px) {
    body::before, body::after {
      content: ''; position: absolute; top: 0; width: calc(50vw - 270px); height: 100%;
      background: repeating-linear-gradient(45deg, #050510 0%, #050510 10px, #0a0a1a 10px, #0a0a1a 20px);
      opacity: 0.5; z-index: 0; pointer-events: none;
    }
    body::before { left: 0; border-right: 2px solid var(--ui-blue); }
    body::after { right: 0; border-left: 2px solid var(--ui-blue); }
  }

  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #bg-canvas { z-index: -2; } #game-canvas { z-index: 5; } #fx-canvas { z-index: 6; }
  #fps-counter { position: absolute; top: calc(65px + var(--safe-top)); right: 10px; color: #0f0; font-size: 10px; font-family: monospace; z-index: 99; opacity: 0.7; }
  
  /* ================= 2. UI 元件與排版 ================= */
  .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 10; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); transition: opacity 0.3s; }
  .hidden { opacity: 0; pointer-events: none; display: none !important; }
  
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); z-index: 20; height: 60px; flex-shrink: 0; border-bottom: 1px solid rgba(0,210,255,0.2); }
  .badge { background: rgba(0,210,255,0.2); border: 1px solid var(--ui-blue); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: var(--ui-blue); }
  .currency { color: var(--ui-gold); font-weight: bold; text-shadow: 0 2px 4px #000; }
  .top-btns button { background: var(--ui-panel); border: 1px solid #555; color: white; padding: 5px 10px; border-radius: 4px; margin-left: 5px; font-size: 12px; cursor: pointer; }
  
  /* 大廳 */
  .hangar-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .hangar-title { font-size: 24px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--ui-blue); margin-bottom: -10px; z-index: 1; }
  #hangar-canvas { width: 240px; height: 190px; pointer-events: auto; cursor: pointer; }
  .tower-info-tag { background: var(--ui-dark); border: 1px solid #00ff88; padding: 5px 15px; border-radius: 20px; font-size: 12px; color: #00ff88; margin-top: -10px; z-index: 1; text-align: center; line-height: 1.4; }
  
  .campaign-board { display: flex; flex-direction: column; gap: 15px; padding: 20px; margin-bottom: 10px; }
  .route-btn { background: linear-gradient(135deg, rgba(20,40,80,0.9), rgba(10,20,40,0.9)); border: 2px solid var(--ui-blue); border-radius: 12px; padding: 20px; color: white; font-size: 18px; font-weight: bold; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5); cursor: pointer; }
  .route-btn::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent); transform: rotate(45deg); animation: shine 3s infinite; pointer-events: none; }
  @keyframes shine { 0% { left: -100%; } 100% { left: 100%; } }
  
  .bottom-nav { display: flex; justify-content: space-between; padding: 10px 15px; background: rgba(0,0,0,0.8); border-top: 1px solid #444; }
  .nav-btn { flex: 1; background: var(--ui-panel); border: 1px solid #555; border-radius: 8px; padding: 10px 0; margin: 0 5px; color: #ddd; font-size: 13px; font-weight: bold; text-align: center; cursor: pointer; }
  
  /* 戰鬥與結算 */
  .battle-hud { display: flex; justify-content: space-between; padding: 10px 20px; z-index: 20; background: rgba(0,0,0,0.6); }
  .hp-bar-bg { width: 150px; height: 12px; background: #222; border: 1px solid #555; border-radius: 6px; overflow: hidden; margin-top: 5px; }
  .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00ff88, #00bfff); transition: width 0.2s; }
  
  .quiz-panel { background: linear-gradient(to top, rgba(10,15,30,1) 70%, rgba(10,15,30,0.8)); border-top: 2px solid var(--ui-blue); padding: 15px; padding-bottom: calc(15px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 10px; z-index: 20; }
  .question-text { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 5px; min-height: 50px; display: flex; align-items: center; justify-content: center; }
  .timer-bar { height: 4px; background: #333; border-radius: 2px; overflow: hidden; margin-bottom: 5px; }
  .timer-fill { height: 100%; background: #00d2ff; width: 100%; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .option-btn { background: var(--ui-panel); border: 1px solid #447; border-radius: 8px; padding: 15px 5px; color: white; font-size: 15px; font-weight: bold; transition: 0.1s; cursor: pointer; min-height: 55px; }
  .option-btn:active { transform: scale(0.95); }
  .option-btn.correct { background: #008800; border-color: #00ff00; }
  .option-btn.wrong { background: #880000; border-color: #ff0000; }
  
  #victory-banner { position: absolute; top: 30%; left: 0; width: 100%; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.9), transparent); padding: 30px 0; text-align: center; transform: scaleY(0); transition: transform 0.3s; z-index: 150; }
  #victory-banner.show { transform: scaleY(1); }
  
  /* 彈窗共通 (獨立捲動不切邊) */
  .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom)) 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; border-bottom: 1px solid #444; padding-bottom: 10px; }
  .modal-title { font-size: 22px; color: var(--ui-blue); font-weight: bold; }
  .close-btn { background: #c0392b; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  
  .stage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding-bottom: 30px; }
  .stage-node { aspect-ratio: 1; background: var(--ui-dark); border: 1px solid #444; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #666; cursor: pointer; }
  .stage-node.unlocked { color: white; border-color: var(--ui-blue); background: rgba(0,210,255,0.15); box-shadow: inset 0 0 10px rgba(0,210,255,0.3); }
  .stage-node.cleared { color: var(--ui-gold); border-color: var(--ui-gold); background: rgba(255,215,0,0.1); }
  
  .card-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 30px; }
  .card-item { background: var(--ui-panel); border: 1px solid #555; border-radius: 8px; padding: 10px; display: flex; gap: 15px; align-items: center; flex-shrink: 0; min-height: 92px; }
  .card-icon-box { width: 70px; height: 70px; background: rgba(0,0,0,0.5); border-radius: 6px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; position: relative; font-weight:bold; }
  
  /* 轉蛋 */
  #gacha-fx-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .gacha-result-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 95%; max-width: 480px; z-index: 201; }
  .gacha-card { aspect-ratio: 3/4; background: #111; border: 2px solid #333; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transform: translateY(20px) scale(0.8); transition: all 0.3s; }
  .gacha-card.reveal { opacity: 1; transform: translateY(0) scale(1); }
</style>
</head>
<body>
<div id="app">
  <canvas id="bg-canvas"></canvas>
  <canvas id="game-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
  <div id="fps-counter">FPS: 60</div>
  
  <div class="top-bar">
    <div class="stats">
      <div class="badge" id="player-rank">列兵</div>
      <div class="currency">💎 <span id="diamond-count">0</span></div>
    </div>
    <div class="top-btns">
      <button onclick="window.App.addDiamonds(5000)">+5000</button>
      <button onclick="window.App.toggleAudio()">🔊</button>
      <button onclick="window.App.showModal('sys-modal')">⚙️</button>
    </div>
  </div>

  <div id="menu-screen" class="screen">
    <div class="hangar-area">
      <div class="hangar-title">戰術機庫</div>
      <canvas id="hangar-canvas" onclick="window.App.showModal('tower-modal')"></canvas>
      <div class="tower-info-tag" id="hangar-tower-name">N 型號 P01<br><span style="color:#aaa">普通射擊</span></div>
    </div>
    <div class="campaign-board">
      <div class="route-btn" onclick="window.App.openStageSelect('vocab')">
        ⚔️ 單字征途
        <div style="font-size:13px; color:#aaa; margin-top:5px; font-weight:normal;" id="vocab-progress">進度：第 1 / 100 關</div>
      </div>
      <div class="route-btn" style="border-color:var(--ui-purple);" onclick="window.App.openStageSelect('grammar')">
        ⚡ 文法試煉
        <div style="font-size:13px; color:#aaa; margin-top:5px; font-weight:normal;" id="grammar-progress">進度：第 1 / 100 關</div>
      </div>
    </div>
    <div class="bottom-nav">
      <div class="nav-btn" onclick="window.App.showModal('gacha-modal')">🎰 轉蛋機</div>
      <div class="nav-btn" onclick="window.App.showModal('monster-modal')">👾 圖鑑 <span id="monster-col-txt">(0/42)</span></div>
      <div class="nav-btn" onclick="window.App.showModal('wrong-book-modal')">📖 錯題本</div>
    </div>
  </div>

  <div id="combat-screen" class="screen hidden">
    <div class="battle-hud">
      <div><div style="font-size:12px;color:#aaa;">防線耐久</div><div class="hp-bar-bg"><div class="hp-bar-fill" id="base-hp-fill"></div></div></div>
      <div style="text-align:right;"><div style="font-size:12px;color:#aaa;" id="combat-stage-txt">關卡 1</div><div style="font-weight:bold;color:var(--ui-blue);" id="wave-txt">WAVE 1/5</div></div>
    </div>
    <div style="flex:1"></div>
    <div class="quiz-panel">
      <div class="timer-bar"><div class="timer-fill" id="quiz-timer"></div></div>
      <div class="question-text" id="q-text">Loading...</div>
      <div class="options-grid">
        <button class="option-btn" id="opt-0" onclick="window.App.answer(0)"></button>
        <button class="option-btn" id="opt-1" onclick="window.App.answer(1)"></button>
        <button class="option-btn" id="opt-2" onclick="window.App.answer(2)"></button>
        <button class="option-btn" id="opt-3" onclick="window.App.answer(3)"></button>
      </div>
    </div>
  </div>

  <div id="victory-banner">
    <div style="font-size:32px; font-weight:900; color:white; text-shadow:0 0 15px #ffd700, 2px 2px 0 #000; letter-spacing:5px;">VICTORY！</div>
    <div style="margin-top:10px; font-size:20px; color:#00ff88; font-weight:bold; text-shadow:1px 1px 0 #000;">+150 💎</div>
    <div style="margin-top:25px; display:flex; justify-content:center; gap:20px;">
      <button style="padding:10px 20px; border-radius:20px; font-weight:bold; border:none; background:#555; color:white;" onclick="window.App.returnToMenu()">返回大廳</button>
      <button style="padding:10px 20px; border-radius:20px; font-weight:bold; border:none; background:#ffd700; color:black;" onclick="window.App.nextStage()">下一關 ➔</button>
    </div>
  </div>

  <!-- Modals -->
  <div id="stage-modal" class="modal hidden">
    <div class="modal-header"><div class="modal-title" id="stage-modal-title">單字征途</div><button class="close-btn" onclick="window.App.hideModal('stage-modal')">X</button></div>
    <div class="stage-grid" id="stage-grid-container"></div>
  </div>
  <div id="tower-modal" class="modal hidden">
    <div class="modal-header"><div class="modal-title">砲塔裝備庫</div><button class="close-btn" onclick="window.App.hideModal('tower-modal')">X</button></div>
    <div class="card-list" id="tower-list-container"></div>
  </div>
  <div id="monster-modal" class="modal hidden">
    <div class="modal-header"><div class="modal-title">神話異聞錄</div><button class="close-btn" onclick="window.App.hideModal('monster-modal')">X</button></div>
    <div class="card-list" id="monster-list-container"></div>
  </div>
  <div id="wrong-book-modal" class="modal hidden">
    <div class="modal-header"><div class="modal-title">錯題本</div><button class="close-btn" onclick="window.App.hideModal('wrong-book-modal')">X</button></div>
    <div class="card-list" id="wrong-book-container"></div>
  </div>
  <div id="gacha-modal" class="modal hidden">
    <div class="modal-header"><div class="modal-title">星際召喚陣</div><button class="close-btn" onclick="window.App.hideModal('gacha-modal')">X</button></div>
    <div style="text-align:center; margin-bottom:20px; color:#aaa; font-size:14px;">消耗鑽石研發機甲。重複獲得自動轉化為強化等級。<br>N: 50% | R: 35% | SR: 12% | UR: 3%</div>
    <div style="display:flex; justify-content:center; gap:20px; margin-top:20px;">
      <button class="route-btn" style="padding:15px; width:140px; text-align:center;" onclick="window.App.performGacha(1)">單抽<br><span style="color:#ffd700">100 💎</span></button>
      <button class="route-btn" style="padding:15px; width:140px; text-align:center; border-color:#ffd700;" onclick="window.App.performGacha(10)">10 連抽<br><span style="color:#ffd700">900 💎</span><br><span style="font-size:11px;color:#aaa">保底 SR</span></button>
    </div>
  </div>
  <div id="sys-modal" class="modal hidden">
    <div class="modal-header"><div class="modal-title">指揮官終端</div><button class="close-btn" onclick="window.App.hideModal('sys-modal')">X</button></div>
    <div class="card-list">
      <button class="nav-btn" style="background:#800; border-color:#f00; color:white; padding:15px;" onclick="window.App.resetSave()">⚠️ 刪除進度 (重置為第 1 關)</button>
      <div style="margin-top:20px; font-size:14px; color:#aaa;">存檔碼 (可複製至他台裝置)：</div>
      <textarea id="save-code-area" style="width:100%; height:80px; background:#111; color:#0f0; border:1px solid #444; padding:5px; margin-top:5px; font-family:monospace;"></textarea>
      <button class="nav-btn" style="background:#228; margin-top:10px; padding:10px;" onclick="window.App.importSave()">匯入存檔碼並覆蓋</button>
    </div>
  </div>

  <div id="gacha-fx-layer" class="hidden">
    <button style="position:absolute; top:calc(20px + var(--safe-top)); right:20px; z-index:201; background:rgba(255,255,255,0.2); color:white; border:1px solid white; padding:5px 15px; border-radius:15px; cursor:pointer;" onclick="window.App.skipGacha()">跳過 ➔</button>
    <div class="gacha-result-grid" id="gacha-result"></div>
    <button id="gacha-ok-btn" class="hidden" style="z-index:202; margin-top:30px; padding:12px 40px; background:var(--ui-blue); color:black; font-weight:bold; border-radius:25px; border:none; cursor:pointer; font-size:16px;" onclick="window.App.closeGachaFx()">確認</button>
  </div>
</div>

<script>
// ==========================================
// 全域防當機封裝架構 (window.App)
// ==========================================
window.App = (function() {
  const App = {};
  
  // 1. 160 題四階無重複真題庫 (安全解析)
  const Q_RAW = `
vocab|1|The team worked hard to ______ their goals.|accomplish|abandon|destroy|hesitate|0|accomplish 完成
vocab|1|Language can be a ______ to communication.|barrier|carrier|carrier|method|0|barrier 障礙
vocab|1|She is very ______ and studies every night.|diligent|lazy|ignorant|arrogant|0|diligent 勤勉的
vocab|1|Don't ______ to ask if you have questions.|hesitate|meditate|dictate|rotate|0|hesitate 猶豫
vocab|1|He tried to ______ his friend to join.|persuade|invade|evade|parade|0|persuade 說服
vocab|1|The police are ______ of the strange man.|suspicious|delicious|conscious|precious|0|suspicious 可疑的
vocab|1|We need a ______ solution, not a quick fix.|permanent|temporary|momentary|solitary|0|permanent 永久的(考反義)
vocab|1|She is highly ______ in speaking English.|proficient|deficient|efficient|sufficient|0|proficient 精通的
vocab|1|The factory causes serious ______ to the river.|pollution|population|protection|production|0|pollution 汙染
vocab|1|He made a great ______ to the project.|contribution|distribution|attribution|retribution|0|contribution 貢獻
vocab|1|The news caused a lot of ______ among people.|confusion|conclusion|exclusion|inclusion|0|confusion 困惑
vocab|1|He is highly ______ of winning the game.|confident|diffident|evident|incident|0|confident 有信心的
vocab|1|We must ______ our natural resources.|conserve|consume|waste|destroy|0|conserve 保存
vocab|1|The manager will ______ the meeting tomorrow.|attend|intend|pretend|extend|0|attend 參加
vocab|1|The shop offers a wide ______ of products.|variety|society|anxiety|piety|0|variety 多樣化
vocab|1|She was ______ by his sudden appearance.|surprised|supposed|supported|surrounded|0|surprised 驚訝的
vocab|1|The new policy will ______ everyone here.|affect|effect|infect|defect|0|affect 影響(動詞)
vocab|1|The book gives a ______ account of the war.|detailed|failed|sailed|nailed|0|detailed 詳細的
vocab|1|She is a very ______ person who donates a lot.|generous|nervous|jealous|serious|0|generous 慷慨的
vocab|1|We must ______ the problem immediately.|resolve|dissolve|involve|evolve|0|resolve 解決
vocab|2|The food is ______ for the party of 50.|adequate|accurate|absolute|abstract|0|adequate 足夠的

vocab|2|The bridge was ______ by the earthquake.|damaged|managed|packaged|massaged|0|damage 損害
vocab|2|He has a very ______ attitude towards his work.|positive|negative|active|passive|0|positive 正面的
vocab|2|The ______ between the two countries is tense.|relationship|scholarship|friendship|hardship|0|relationship 關係
vocab|2|She is a highly ______ musician.|talented|wanted|planted|granted|0|talented 有天賦的
vocab|2|The museum has a large ______ of old coins.|collection|connection|correction|perfection|0|collection 收藏
vocab|2|She was ______ from the hospital after 3 days.|discharged|charged|recharged|overcharged|0|discharge 離開/出院
vocab|2|The company aims to ______ its business.|expand|spend|suspend|defend|0|expand 擴張
vocab|2|He has a strong ______ to become a doctor.|ambition|tradition|condition|position|0|ambition 抱負
vocab|2|She gave a ______ explanation for her absence.|logical|magical|musical|physical|0|logical 合邏輯的
vocab|2|The boss made a ______ decision without thinking.|hasty|tasty|nasty|pasty|0|hasty 倉促的
vocab|2|The government plans to ______ taxes next year.|reduce|produce|introduce|induce|0|reduce 減少
vocab|2|She received a ______ for her performance.|reward|forward|backward|awkward|0|reward 獎勵
vocab|2|The scientist made an important ______.|discovery|recovery|delivery|bravery|0|discovery 發現
vocab|2|It is difficult to ______ the language barrier.|overcome|overlook|overtake|overdo|0|overcome 克服
vocab|3|His ______ remarks caused a public outcry.|controversial|commercial|beneficial|artificial|0|controversial 爭議的
vocab|3|The instructions were so ______ nobody understood.|ambiguous|obvious|lucid|clear|0|ambiguous 模稜兩可的
vocab|3|Physical education is ______ in this school.|compulsory|voluntary|optional|temporary|0|compulsory 必修強制的
vocab|3|His health began to ______ rapidly.|deteriorate|ameliorate|accelerate|accumulate|0|deteriorate 惡化

  let Q_POOL = [];
  function parseQuestions() {
    try {
      Q_POOL = Q_RAW.trim().split('\n').filter(l => l && !l.startsWith('//')).map(line => {
        let p = line.split('|');
        if(p.length < 9) return null; // 安全過濾
        return { route: p[0], diff: parseInt(p[1]), q: p[2], opts: [p[3], p[4], p[5], p[6]], ans: parseInt(p[7]), exp: p[8] };
      }).filter(q => q !== null);
    } catch(e) { console.error("題庫解析錯誤", e); }
  }

  function getQuestion(route, level) {
    let diff = level <= 25 ? 1 : (level <= 50 ? 2 : (level <= 75 ? 3 : 4));
    let pool = Q_POOL.filter(q => q.route === route && q.diff === diff);
    if(pool.length === 0) pool = Q_POOL; 
    return pool[Math.floor(Math.random() * pool.length)]; // Fisher-Yates 池概念 (此處用隨機簡化)
  }

      "卡邦克魯","喪屍犬","半魚人","冰霜巨獸","熔岩魔","弗蘭肯斯坦","樹精","木乃伊","飛頭蠻","報喪女妖",
      "卓柏卡布拉","雪女","隱形人","邪神克蘇魯","貝希摩斯","利維坦","阿努比斯","羽蛇神","牛魔王","死神",

  function playSynth(type) {
    if(!Save.sound) return;
    try {
      if(!audioCtx) audioCtx = new AudioCtx();
      let osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), now = audioCtx.currentTime;
      osc.connect(gain); gain.connect(audioCtx.destination);
      if(type === 'shoot') {
        osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if(type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if(type === 'correct') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now+0.1);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if(type === 'wrong') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.4);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if(type === 'gacha') {
        [440, 554, 659, 880].forEach((f, i) => {
          let o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.2, now + i*0.1); g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.5);
          o.connect(g); g.connect(audioCtx.destination); o.start(now + i*0.1); o.stop(now + i*0.1 + 0.5);
        });
      } else if(type === 'victory') {
        osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now+0.2); osc.frequency.setValueAtTime(659, now+0.4);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 1.0);
        osc.start(now); osc.stop(now + 1.0);
      }
    } catch(e) {}
  }

  class Projectile {
    constructor(x, y, target, type, damage, speed = 800) {
      this.x = x; this.y = y; this.target = target; this.type = type; this.damage = damage; this.speed = speed; this.active = true;
      this.angle = target ? Math.atan2(target.y - y, target.x - x) : 0;
      this.homing = type.includes('homing') || type === 'ultimate';
      if (this.type === 'blackhole') this.life = 1.5;
    }
    update(dt) {
      if (!this.active) return;
      if (this.type === 'blackhole') {
        this.life -= dt; if (this.life <= 0) this.active = false;
        monsters.forEach(m => { if (Math.hypot(m.x - this.x, m.y - this.y) < 120) { m.x += (this.x - m.x) * 0.05 + 1.5; m.y += (this.y - m.y) * 0.05; } });
        return;
      }
      if (this.homing && this.target && this.target.hp > 0) this.angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
      this.x += Math.cos(this.angle) * this.speed * dt; this.y += Math.sin(this.angle) * this.speed * dt;
      if (this.x < 0 || this.x > 1200 || this.y < 0 || this.y > 800) this.active = false;
      if (this.target && Math.hypot(this.x - this.target.x, this.y - this.target.y) < 30) {
        this.active = false;
        Combat.applyDamageAndEffects(this.target, this.damage, this.type, {x: this.x, y: this.y});
      }
    }
    draw(ctx) {
      if (!this.active) return;
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
      if (this.type === 'blackhole') {
        ctx.rotate(Date.now() * 0.01); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, 30 + Math.sin(Date.now()*0.01)*5, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle='#bc13fe'; ctx.lineWidth=2; ctx.stroke();
      } else if (this.type.includes('slow')) { ctx.fillStyle = '#63B3ED'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill(); }
      else if (this.type.includes('burn')) { ctx.fillStyle = '#F56565'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill(); }
      else if (this.type.includes('poison')) { ctx.fillStyle = '#9F7AEA'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill(); }
      else { ctx.fillStyle = '#E2E8F0'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-5, 5); ctx.lineTo(-5, -5); ctx.fill(); }
      ctx.restore();
    }
  }

  const Combat = {
    fire: (turret, target, ctx) => {
      if (!target && !turret.skill.includes('aura')) return;
      if (turret.skill === 'aura_slow') { monsters.forEach(m => { if (Math.hypot(m.x - turret.x, m.y - turret.y) < turret.range) m.addBuff('ice', { speedMult: 0.75, duration: 10 }); }); return; }
      if (turret.skill.includes('laser')) {
        let width = turret.skill === 'super_laser' ? 1200 : 600; let endX = turret.x + width;
        visualEffects.push({ type: 'laser', start: {x: turret.x, y: turret.y}, end: {x: endX, y: turret.y}, thickness: turret.skill === 'super_laser' ? 20 : 8, color: '#3182CE', life: 0.2 });
        monsters.forEach(m => { if (m.x > turret.x && m.x < endX && Math.abs(m.y - turret.y) < 30) Combat.applyDamageAndEffects(m, turret.damage, turret.skill, {x: turret.x, y: turret.y}); });
        return;
      }
      if (turret.skill === 'timestop') { monsters.forEach(m => m.addBuff('timestop', { duration: 1.5 })); return; }
      if (turret.skill.includes('scatter')) {
        let count = turret.skill === 'scatter_homing' ? 6 : 3;
        for(let i=0; i<count; i++) { let p = new Projectile(turret.x, turret.y, target, turret.skill, turret.damage); p.angle += (i - (count-1)/2) * 0.2; projectiles.push(p); }
        return;
      }
      if (turret.skill === 'ultimate') { for(let i=0; i<4; i++) projectiles.push(new Projectile(turret.x, turret.y, target, 'ultimate', turret.damage)); return; }
      projectiles.push(new Projectile(turret.x, turret.y, target, turret.skill, turret.damage));
    },
    applyDamageAndEffects: (target, damage, skill, pos) => {
      target.hp -= damage; floatingTexts.push({ x: target.x, y: target.y-20, text: `-${Math.floor(damage)}`, color: '#fff', life: 1.0 }); playSynth('hit');
      if (skill === 'slow') { target.addBuff('ice', { speedMult: 0.5, duration: 3 }); target.tint = '#90CDF4'; }
      if (skill === 'chain' || skill === 'bounce_laser') {
        let current = target;
        monsters.filter(m => m !== target && Math.hypot(m.x - current.x, m.y - current.y) < 150).slice(0, 3).forEach(nt => {
          nt.hp -= damage * 0.8; visualEffects.push({ type: 'lightning', start: {x: current.x, y: current.y}, end: {x: nt.x, y: nt.y}, color: '#F6E05E', life: 0.2 }); current = nt;
        });
      }
      if (skill === 'burn') { target.addBuff('burn', { dot: target.maxHp * 0.08, duration: 4 }); target.tint = '#FC8181'; }
      if (skill === 'poison') { target.addBuff('poison', { dot: target.maxHp * 0.08, duration: 4 }); target.tint = '#B794F4'; }
      if (skill === 'knockback') target.x = Math.max(0, target.x - 45);
      if (skill === 'stun') target.addBuff('stun', { duration: 1 });
      if (skill === 'ultimate' && pos) { monsters.forEach(m => { if (Math.hypot(m.x - pos.x, m.y - pos.y) < 150) m.hp -= damage * 2; }); }
      if (skill === 'gold_crit' && target.hp <= 0) { Save.diam += 5; floatingTexts.push({ x: target.x, y: target.y-40, text: `+5💎`, color: '#ffd700', life: 1.0 }); }
    }
  };

  // 5. 繪圖引擎 (無 shadowBlur)
  function drawGlow(ctx, x, y, r, color, alpha=0.5) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = color.replace(')', `, ${alpha})`).replace('rgb', 'rgba'); ctx.fill();
  }
  function drawTower(ctx, towerObj, x, y, angle, scale=1) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.fillStyle = '#223'; ctx.beginPath(); ctx.moveTo(-30, 20); ctx.lineTo(30, 20); ctx.lineTo(20, -10); ctx.lineTo(-20, -10); ctx.fill(); ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1; ctx.stroke();
    let c = {'N':'rgba(0,100,255,', 'R':'rgba(150,0,255,', 'SR':'rgba(255,200,0,', 'UR':'rgba(255,0,255,'}[towerObj.rarity] || 'rgba(0,100,255,';
    drawGlow(ctx, 0, 10, 40, c+'1)', 0.2);
    ctx.rotate(angle); ctx.fillStyle = '#555';
    let recoil = (towerObj.cooldown || 0) > 0 ? -5 : 0;
    if(towerObj.rarity === 'N' || towerObj.rarity === 'R') { ctx.fillRect(0, -5, 35 + recoil, 10); } 
    else { ctx.fillRect(0, -10, 40 + recoil, 8); ctx.fillRect(0, 2, 40 + recoil, 8); }
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fillStyle = '#334'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.stroke();
    if((towerObj.cooldown || 0) > (1/towerObj.fireRate - 0.1)) { ctx.fillStyle = '#fa0'; ctx.beginPath(); ctx.moveTo(40, -5); ctx.lineTo(55, 0); ctx.lineTo(40, 5); ctx.fill(); }
    ctx.restore();
  }

  // 42種神話怪物繪圖分群
  function drawMonster(ctx, id_num, color, x, y, time) {
    ctx.save(); ctx.translate(x, y);
    const bounce = Math.abs(Math.sin(time * 4)) * 6;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0, 10, 20 - bounce*0.5, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.translate(0, -bounce);
    
    // 繪製骨架輔助
    const drawPath = (pts, fill, stroke) => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for(let i=1;i<pts.length;i++) { if(pts[i].cx) ctx.quadraticCurveTo(pts[i].cx, pts[i].cy, pts[i].x, pts[i].y); else ctx.lineTo(pts[i].x, pts[i].y); } ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.lineWidth=1.5;ctx.strokeStyle=stroke;ctx.stroke();} };

    if (id_num === 0) { // 尼斯湖水怪
      ctx.fillStyle = '#3182CE'; ctx.beginPath(); for(let i=-20; i<=20; i+=10) ctx.lineTo(i, 5+Math.sin(time*3+i*0.1)*3); ctx.lineTo(20, 15); ctx.lineTo(-20, 15); ctx.fill();
      const neck = Math.sin(time)*10; ctx.strokeStyle=color; ctx.lineWidth=10; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,10); ctx.quadraticCurveTo(20+neck, -15, neck*0.5, -35); ctx.stroke();
      ctx.save(); ctx.translate(neck*0.5, -35); drawPath([{x:-8,y:-5},{x:10,y:-8},{x:15,y:0},{x:10,y:8},{x:-6,y:5}], color, '#000'); ctx.fillStyle='#E53E3E'; ctx.beginPath(); ctx.arc(5,-2,2,0,Math.PI*2); ctx.fill(); ctx.restore();
    } else if (id_num === 1) { // 九尾妖狐
      for(let i=0; i<9; i++) { ctx.save(); ctx.rotate((Math.PI/10)*(i+1) - Math.PI/2); drawPath([{x:0,y:0},{x:-15,y:-20,cx:-10,cy:-10},{x:0,y:-40,cx:-20,cy:-30},{x:15,y:-20,cx:20,cy:-30}], color, '#F6AD55'); ctx.restore(); }
      drawPath([{x:-10,y:-5},{x:-20,y:-25},{x:-5,y:-15}], color, '#000'); drawPath([{x:10,y:-5},{x:20,y:-25},{x:5,y:-15}], color, '#000');
      drawPath([{x:0,y:10},{x:-20,y:-10},{x:0,y:-5},{x:20,y:-10}], '#fff', '#000');
    } else if (id_num === 2 || id_num === 33) { // 觸手系
      for(let i=0; i<6; i++) { ctx.strokeStyle=color; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-12+i*5, 10); ctx.quadraticCurveTo(-12+i*5+Math.sin(time*2+i)*10, 30, -12+i*5, 40); ctx.stroke(); }
      drawPath([{x:-20,y:10},{x:-25,y:-15,cx:-30,cy:0},{x:0,y:-30,cx:-10,cy:-35},{x:25,y:-15,cx:10,cy:-35},{x:20,y:10,cx:30,cy:0}], color, '#000');
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(-8,-5,4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(8,-5,4,0,Math.PI*2); ctx.fill();
    } else if (id_num === 3 || id_num === 35) { // 多頭蛇
      drawPath([{x:-25,y:10},{x:-15,y:-15,cx:-30,cy:-5},{x:15,y:-15,cx:0,cy:-25},{x:25,y:10,cx:30,cy:-5}], color, '#000');
      for(let i=0; i<5; i++) { let sp = (Math.PI/4)*i - Math.PI/2; ctx.save(); ctx.translate(Math.sin(sp)*10, -10-Math.cos(sp)*10); ctx.rotate(sp*0.5+Math.sin(time+i)*0.1); ctx.beginPath(); ctx.moveTo(-5,0); ctx.quadraticCurveTo(-8,15,-3,30); ctx.lineTo(3,30); ctx.quadraticCurveTo(8,15,5,0); ctx.fillStyle=color; ctx.fill(); drawPath([{x:-8,y:0},{x:-10,y:-10},{x:10,y:-15},{x:15,y:-5},{x:8,y:5}], color, '#000'); ctx.restore(); }
    } else if (id_num >= 4 && id_num <= 12) { // 有翼類 (天蛾人/鳳凰/飛龍)
      let flap = Math.sin(time*5)*0.5;
      ctx.save(); ctx.scale(-1,1); ctx.rotate(flap); drawPath([{x:0,y:0},{x:20,y:-25,cx:10,cy:-15},{x:50,y:-30,cx:35,cy:-35},{x:40,y:-5,cx:50,cy:-15},{x:15,y:10,cx:25,cy:10}], color, '#000'); ctx.restore();
      ctx.save(); ctx.rotate(-flap); drawPath([{x:0,y:0},{x:20,y:-25,cx:10,cy:-15},{x:50,y:-30,cx:35,cy:-35},{x:40,y:-5,cx:50,cy:-15},{x:15,y:10,cx:25,cy:10}], color, '#000'); ctx.restore();
      ctx.beginPath(); ctx.ellipse(0,0,10,15,0,0,Math.PI*2); ctx.fillStyle=color; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,-20,8,0,Math.PI*2); ctx.fill(); ctx.stroke();
    } else { // 人形/重裝 (牛頭人/獨眼/死神等)
      let arm = Math.sin(time*2)*15;
      ctx.save(); ctx.translate(-15,-10); ctx.rotate(arm*Math.PI/180); drawPath([{x:0,y:0},{x:-8,y:10},{x:-4,y:25},{x:4,y:10}], color, '#000'); ctx.restore();
      drawPath([{x:-12,y:-15},{x:12,y:-15},{x:15,y:10},{x:-15,y:10}], color, '#000');
      ctx.save(); ctx.translate(15,-10); ctx.rotate(-arm*Math.PI/180); drawPath([{x:0,y:0},{x:8,y:10},{x:4,y:25},{x:-4,y:10}], color, '#000'); ctx.restore();
      ctx.save(); ctx.translate(0,-25); 
      if(id_num === 8) { // 美杜莎蛇髮
        ctx.strokeStyle='#48BB78'; ctx.lineWidth=2; for(let i=0;i<6;i++){ let sw=Math.sin(time*3+i)*4; ctx.beginPath(); ctx.moveTo(0,5); ctx.quadraticCurveTo(-10+i*4,-5+sw, -15+i*5+sw,-10); ctx.stroke(); }
      }
      ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fillStyle=color; ctx.fill(); ctx.stroke();
      if(id_num === 6) { drawPath([{x:-8,y:-5},{x:-20,y:-15},{x:-4,y:-8}], '#fff', '#000'); drawPath([{x:8,y:-5},{x:20,y:-15},{x:4,y:-8}], '#fff', '#000'); } // 牛角
      ctx.restore();
    }
    ctx.restore();
  }

  // 6. UI 與遊戲流程邏輯
  App.showModal = id => document.getElementById(id).classList.remove('hidden');
  App.hideModal = id => document.getElementById(id).classList.add('hidden');
  
  App.openStageSelect = function(route) {
    try {
      currentRoute = route; document.getElementById('stage-modal-title').innerText = route === 'vocab' ? '⚔️ 單字征途' : '⚡ 文法試煉';
      let c = document.getElementById('stage-grid-container'); c.innerHTML = '';
      let prog = Save.progress[route];
      for(let i=1; i<=100; i++) {
        let div = document.createElement('div'); div.className = 'stage-node'; if(i%10===0) div.classList.add('boss');
        div.innerText = i;
        if(i < prog) div.classList.add('cleared'); else if(i === prog) div.classList.add('unlocked');
        if(i <= prog) { div.onclick = () => { App.hideModal('stage-modal'); startCombat(route, i); }; } else { div.style.opacity = '0.3'; }
        c.appendChild(div);
      }
      App.showModal('stage-modal');
    } catch(e) {}
  };

  function initLists() {
    try {
      let tC = document.getElementById('tower-list-container'); tC.innerHTML = '';
      TOWER_DATA.forEach(t => {
        let lvl = Save.towers[t.id]; if(!lvl) return;
        let d = document.createElement('div'); d.className = 'card-item';
        d.innerHTML = `<div class="card-icon-box" style="border:1px solid ${t.rarity==='UR'?'#f0f':t.rarity==='SR'?'#fa0':'#555'}">${t.rarity}</div><div class="card-info"><div class="card-name">${t.name} <span class="badge">Lv.${lvl}</span></div><div style="font-size:12px;color:#aaa;">攻擊力: ${t.dmg + lvl*2} | 特性: ${t.skill}</div><button style="margin-top:5px;padding:5px;background:var(--ui-blue);border:none;border-radius:4px;font-weight:bold;cursor:pointer;" onclick="window.App.equipTower('${t.id}')">裝備</button></div>`;
        tC.appendChild(d);
      });
      let mC = document.getElementById('monster-list-container'); mC.innerHTML = '';
      MONSTER_DATA.forEach(m => {
        let d = document.createElement('div'); d.className = 'card-item'; let ul = Save.unlockedMonsters.includes(m.id);
        d.innerHTML = `<div class="card-icon-box" style="font-size:24px;">${ul?'👾':'❓'}</div><div class="card-info"><div class="card-name">${ul?m.name:'未知生物'}</div><div style="font-size:12px;color:#aaa;">${ul?`型態: ${m.type}`:'通關遭遇以解鎖'}</div></div>`;
        if(!ul) d.style.opacity = '0.5'; mC.appendChild(d);
      });
      let wC = document.getElementById('wrong-book-container'); wC.innerHTML = '';
      Save.wrongBook.forEach(q => {
        let d = document.createElement('div'); d.className = 'card-item';
        d.innerHTML = `<div style="flex:1"><div style="font-weight:bold;margin-bottom:4px;">${q.q}</div><div style="font-size:12px;color:#0f0;">解答: ${q.opts[q.ans]} (${q.exp})</div></div>`;
        wC.appendChild(d);
      });

  }
  App.equipTower = function(id) { Save.eqTower = id; saveGame(); updateUI(); App.hideModal('tower-modal'); };

  let gachaResults = [];
  App.performGacha = function(times) {
    try {
      let cost = times === 1 ? 100 : 900; if(Save.diam < cost) return alert('鑽石不足！');
      Save.diam -= cost; saveGame(); updateUI(); gachaResults = [];
      for(let i=0; i<times; i++) {
        let r = Math.random(), rarity = 'N'; if(times === 10 && i === 9) r = 0;
        if(r < 0.03) rarity = 'UR'; else if(r < 0.15) rarity = 'SR'; else if(r < 0.50) rarity = 'R';
        let pool = TOWER_DATA.filter(t => t.rarity === rarity); let getT = pool[Math.floor(Math.random() * pool.length)];
        gachaResults.push(getT); Save.towers[getT.id] = (Save.towers[getT.id] || 0) + 1;
      }
      saveGame(); document.getElementById('gacha-fx-layer').classList.remove('hidden');
      let grid = document.getElementById('gacha-result'); grid.innerHTML = ''; document.getElementById('gacha-ok-btn').classList.add('hidden');
      if(gachaResults.some(t=>t.rarity==='SR'||t.rarity==='UR')) { playSynth('gacha'); vibrate(500); } else { playSynth('correct'); vibrate(100); }
      gachaResults.forEach((t, idx) => {
        let c = document.createElement('div'); c.className = `gacha-card r-${t.rarity}`;
        c.innerHTML = `<div style="font-weight:bold; color:#fff;">${t.rarity}</div><div style="font-size:10px; text-align:center; color:#ccc; margin-top:5px;">${t.name}</div>`;
        grid.appendChild(c); setTimeout(() => { c.classList.add('reveal'); playSynth('hit'); vibrate(20); }, 300 + idx*150);
      });
      setTimeout(() => document.getElementById('gacha-ok-btn').classList.remove('hidden'), 300 + times*150);
    } catch(e) {}
  };
  App.skipGacha = () => { document.querySelectorAll('.gacha-card').forEach(c => c.classList.add('reveal')); document.getElementById('gacha-ok-btn').classList.remove('hidden'); };
  App.closeGachaFx = () => { document.getElementById('gacha-fx-layer').classList.add('hidden'); initLists(); };

  // 7. 戰鬥迴圈與邏輯
  function startCombat(route, level) {
    try {
      currentRoute = route; currentLevel = level; gameState = 'combat';
      monsters = []; projectiles = []; particles = []; floatingTexts = []; visualEffects = [];
      baseHp = maxBaseHp; wave = 1; spawnTimer = 2; combo = 0;
      let eqT = TOWER_DATA.find(t => t.id === Save.eqTower) || TOWER_DATA[0];
      currentTower = { ...eqT, x: 50, y: document.getElementById('game-canvas').height/2 + 50, cooldown: 0, level: Save.towers[eqT.id] || 1 };
      document.getElementById('combat-screen').classList.remove('hidden'); document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('combat-stage-txt').innerText = `${route==='vocab'?'單字':'文法'} 第 ${level} 關`;
      nextQuestion();
    } catch(e) {}
  }
  function nextQuestion() {
    activeQuestion = getQuestion(currentRoute, currentLevel);
    if(!activeQuestion) { alert("題庫載入失敗"); return App.returnToMenu(); }
    document.getElementById('q-text').innerText = activeQuestion.q;
    for(let i=0; i<4; i++) { let btn = document.getElementById(`opt-${i}`); btn.innerText = activeQuestion.opts[i]; btn.className = 'option-btn'; }
    quizTimer = quizMaxTime; answeredCorrectly = false;
  }

  App.answer = function(idx) {
    if(answeredCorrectly || towerOverheat > 0) return;
    try {
      let btn = document.getElementById(`opt-${idx}`);
      if(idx === activeQuestion.ans) {
        btn.classList.add('correct'); playSynth('correct'); combo++; answeredCorrectly = true;
        let dmgMult = 1 + (currentTower.level * 0.1);
        if(quizMaxTime - quizTimer <= 3.5) { dmgMult *= 2; floatingTexts.push({ x: currentTower.x, y: currentTower.y - 40, text: '神速!', color: '#0ff', life: 1.0 }); }
        if(combo >= 4) { dmgMult *= 1.5; floatingTexts.push({ x: currentTower.x, y: currentTower.y - 60, text: 'FEVER!', color: '#fa0', life: 1.0 }); }
        if(monsters.length > 0) {
          let orig = currentTower.damage || currentTower.dmg; currentTower.damage = (currentTower.dmg * dmgMult);
          Combat.fire(currentTower, monsters.find(m => Math.hypot(m.x-currentTower.x, m.y-currentTower.y) < currentTower.range), document.getElementById('game-canvas').getContext('2d'));
          currentTower.damage = orig; currentTower.cooldown = 1/currentTower.fireRate; playSynth('shoot'); vibrate(50);
        }
        setTimeout(() => { if(gameState === 'combat') nextQuestion(); }, 500);
      } else {
        btn.classList.add('wrong'); document.getElementById(`opt-${activeQuestion.ans}`).classList.add('correct');
        playSynth('wrong'); vibrate(200); combo = 0; towerOverheat = 0.7;
        monsters.forEach(m => m.speedBoost = 1.25);
        if(!Save.wrongBook.find(q => q.q === activeQuestion.q)) { Save.wrongBook.push(activeQuestion); saveGame(); }
        answeredCorrectly = true; setTimeout(() => { if(gameState === 'combat') nextQuestion(); }, 1500);
      }
    } catch(e) {}
  };

  function spawnMonster() {
    let pool = MONSTER_DATA; if(wave === maxWave && currentLevel % 10 === 0) pool = MONSTER_DATA.filter(m => m.type === 'boss');
    let data = pool[Math.floor(Math.random() * pool.length)];
    let scale = 1 + currentLevel * 0.08;
    monsters.push({
      id_num: parseInt(data.id.replace('M','')) - 1, x: window.innerWidth + 50, y: document.getElementById('game-canvas').height/2 + (Math.random()*100 - 50),
      hp: data.hpBase * scale, maxHp: data.hpBase * scale, speed: data.spdBase, speedBoost: 1, effects: [], tint: null,
      addBuff: function(name, effect) { this.effects.push({type: name, ...effect}); }
    });
    if(!Save.unlockedMonsters.includes(data.id)) { Save.unlockedMonsters.push(data.id); saveGame(); }
  }

  function updateCombat(dt) {
    if(!answeredCorrectly && towerOverheat <= 0) {
      quizTimer -= dt; document.getElementById('quiz-timer').style.width = Math.max(0, (quizTimer/quizMaxTime)*100) + '%';
      if(quizTimer <= 0) {
        playSynth('wrong'); vibrate(200); towerOverheat = 0.7; combo = 0; answeredCorrectly = true;
        document.getElementById(`opt-${activeQuestion.ans}`).classList.add('correct');
        setTimeout(() => { if(gameState === 'combat') nextQuestion(); }, 1000);
      }
    }
    if(towerOverheat > 0) towerOverheat -= dt;
    if(currentTower.cooldown > 0) currentTower.cooldown -= dt;
    
    spawnTimer -= dt; if(spawnTimer <= 0 && wave <= maxWave) { spawnMonster(); wave++; document.getElementById('wave-txt').innerText = `WAVE ${Math.min(wave, maxWave)}/${maxWave}`; spawnTimer = 3.0; }
    
    for(let i = monsters.length-1; i >= 0; i--) {
      let m = monsters[i], speedMult = m.speedBoost; m.speedBoost = Math.max(1, m.speedBoost - dt);
      for(let j = m.effects.length-1; j >= 0; j--) {
        let e = m.effects[j]; e.duration -= dt;
        if(e.duration <= 0) { m.effects.splice(j, 1); if(m.effects.length===0) m.tint = null; continue; }
        if(e.type === 'ice') speedMult *= e.speedMult;
        if(e.type === 'timestop' || e.type === 'stun') speedMult = 0;
        if(e.type === 'burn' || e.type === 'poison') { m.hp -= e.dot * dt; if(Math.random()<0.1) particles.push({x:m.x, y:m.y, vx:(Math.random()-0.5)*50, vy:(Math.random()-0.5)*50, life:1, color:(e.type==='burn'?'#F56565':'#9F7AEA')}); }
      }
      m.x -= m.speed * speedMult * dt;
      if(m.hp <= 0) {
        monsters.splice(i, 1); playSynth('hit'); for(let p=0; p<10; p++) particles.push({x:m.x,y:m.y,vx:(Math.random()-0.5)*100,vy:(Math.random()-0.5)*100,life:1,color:'#0ff'});
        if(monsters.length === 0 && wave > maxWave) triggerVictory(); continue;
      }
      if(m.x < 100) {
        baseHp -= m.hp; monsters.splice(i, 1); document.getElementById('base-hp-fill').style.width = Math.max(0, (baseHp/maxBaseHp)*100) + '%';
        playSynth('wrong'); vibrate(300);
        if(baseHp <= 0) { alert("防線崩潰！"); App.returnToMenu(); } else if (monsters.length === 0 && wave > maxWave) { triggerVictory(); }
      }
    }
    for(let i = projectiles.length-1; i >= 0; i--) { let p = projectiles[i]; p.update(dt); if(!p.active) projectiles.splice(i, 1); }
  }

  function triggerVictory() {
    gameState = 'victory'; document.getElementById('victory-banner').classList.add('show'); playSynth('victory'); App.addDiamonds(150);
    if(currentRoute === 'vocab') Save.progress.vocab = Math.min(100, Save.progress.vocab + 1); else Save.progress.grammar = Math.min(100, Save.progress.grammar + 1);
    saveGame();
  }
  App.returnToMenu = function() { document.getElementById('combat-screen').classList.add('hidden'); document.getElementById('victory-banner').classList.remove('show'); document.getElementById('menu-screen').classList.remove('hidden'); gameState = 'menu'; updateUI(); };
  App.nextStage = function() { document.getElementById('victory-banner').classList.remove('show'); startCombat(currentRoute, currentLevel + 1); };

  // 8. 繪圖與 Main Loop
  const cvs = document.getElementById('game-canvas'), ctx = cvs.getContext('2d', {alpha:true});
  const bgCvs = document.getElementById('bg-canvas'), bgCtx = bgCvs.getContext('2d', {alpha:false});
  const fxCvs = document.getElementById('fx-canvas'), fxCtx = fxCvs.getContext('2d', {alpha:true});

  function drawBackground(w, h, time) {
    let grad = bgCtx.createLinearGradient(0, 0, 0, h); grad.addColorStop(0, '#020210'); grad.addColorStop(1, '#052530');
    bgCtx.fillStyle = grad; bgCtx.fillRect(0, 0, w, h);
    bgCtx.fillStyle = '#fff';
    for(let i=0; i<30; i++) { let x=(Math.sin(i*123)*0.5+0.5)*w, y=(Math.cos(i*321)*0.5+0.5)*h; bgCtx.globalAlpha=Math.sin(time+i)*0.5+0.5; bgCtx.fillRect(x,y,1.5,1.5); }
    bgCtx.globalAlpha = 1; bgCtx.strokeStyle = 'rgba(0,210,255,0.15)'; bgCtx.lineWidth = 1;
    let cy = h/2 + 50; bgCtx.beginPath();
    for(let i=-2; i<=2; i++) { bgCtx.moveTo(w, cy+i*40); bgCtx.lineTo(0, cy+i*80); }
    let offset = (time*50)%100; for(let i=0; i<w; i+=100) { bgCtx.moveTo(w-i-offset, cy-80); bgCtx.lineTo(w-i-offset, cy+160); }
    bgCtx.stroke();
  }

  function drawGame(dt, now) {
    ctx.clearRect(0, 0, cvs.width, cvs.height); fxCtx.clearRect(0, 0, fxCvs.width, fxCvs.height);
    if(gameState === 'combat' && currentTower) {
      drawGlow(ctx, 80, cvs.height/2+50, Math.sin(now*5)*10+100, '#0ff', 0.1);
      let dx = (monsters.length>0?monsters[0].x:cvs.width) - currentTower.x, dy = (monsters.length>0?monsters[0].y:cvs.height/2+50) - currentTower.y;
      drawTower(ctx, currentTower, currentTower.x, currentTower.y, Math.atan2(dy, dx), 1.5);
    }
    monsters.forEach(m => {
      drawMonster(ctx, m.id_num, m.tint || '#4A5568', m.x, m.y, now);
      ctx.fillStyle='#000'; ctx.fillRect(m.x-20, m.y-40, 40, 5); ctx.fillStyle='#f00'; ctx.fillRect(m.x-20, m.y-40, 40*(m.hp/m.maxHp), 5);
    });
    projectiles.forEach(p => p.draw(ctx));
    
    for(let i=visualEffects.length-1; i>=0; i--) {
      let e = visualEffects[i]; e.life -= dt; if(e.life<=0) { visualEffects.splice(i,1); continue; }
      if(e.type === 'laser') { ctx.strokeStyle=e.color; ctx.lineWidth=e.thickness; ctx.beginPath(); ctx.moveTo(e.start.x, e.start.y); ctx.lineTo(e.end.x, e.end.y); ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=e.thickness*0.4; ctx.stroke(); }
      else if(e.type === 'lightning') { ctx.strokeStyle=e.color; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(e.start.x, e.start.y); let dx=e.end.x-e.start.x, dy=e.end.y-e.start.y, st=Math.floor(Math.hypot(dx,dy)/15); for(let j=1;j<st;j++){ ctx.lineTo(e.start.x+dx*(j/st)+(Math.random()-0.5)*20, e.start.y+dy*(j/st)+(Math.random()-0.5)*20); } ctx.lineTo(e.end.x, e.end.y); ctx.stroke(); }
    }
    for(let i=particles.length-1; i>=0; i--) { let p = particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0) { particles.splice(i,1); continue; } fxCtx.fillStyle=p.color.replace('rgb','rgba').replace(')',`, ${p.life})`); fxCtx.fillRect(p.x, p.y, 3, 3); }
    fxCtx.font = "bold 16px sans-serif";
    for(let i=floatingTexts.length-1; i>=0; i--) { let ft = floatingTexts[i]; ft.y-=20*dt; ft.life-=dt; if(ft.life<=0) { floatingTexts.splice(i,1); continue; } fxCtx.fillStyle=ft.color; fxCtx.globalAlpha=ft.life; fxCtx.fillText(ft.text, ft.x, ft.y); }
    fxCtx.globalAlpha = 1;
  }

  let lastTime = 0, fpsFrames = 0, lastFpsTime = 0;
  function loop(timestamp) {
    if(!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000; lastTime = timestamp; if(dt > 0.1) dt = 0.1;
    fpsFrames++; if(timestamp - lastFpsTime >= 1000) { document.getElementById('fps-counter').innerText = `FPS: ${fpsFrames}`; fpsFrames = 0; lastFpsTime = timestamp; }
    
    try {
      drawBackground(bgCvs.width, bgCvs.height, timestamp/1000);
      if(gameState === 'menu') {
        let hc = document.getElementById('hangar-canvas'), hctx = hc.getContext('2d'); hctx.clearRect(0,0,hc.width,hc.height);
        drawTower(hctx, TOWER_DATA.find(t=>t.id===Save.eqTower)||TOWER_DATA[0], hc.width/2, hc.height/2, Math.sin(timestamp/500)*0.2, 2.0);
      } else if(gameState === 'combat' || gameState === 'victory') { updateCombat(dt); drawGame(dt, timestamp/1000); }
    } catch(e) {}
    requestAnimationFrame(loop);
  }

  function resizeCanvas() {
    let w = document.getElementById('app').clientWidth, h = document.getElementById('app').clientHeight;
    [bgCvs, cvs, fxCvs].forEach(c => { if(c) { c.width = w; c.height = h; } });
  }

  App.init = function() {
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
    parseQuestions(); loadSave(); initLists(); requestAnimationFrame(loop);
  };
  return App;
})();

window.addEventListener('DOMContentLoaded', () => { try { window.App.init(); } catch (e) { console.error("初始化嚴重錯誤", e); alert('核心載入錯誤，但介面防護已啟動'); } });
</script>
</body>
